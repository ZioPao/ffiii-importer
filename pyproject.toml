[project]
name = "ffiii-importer"
version = "0.1.0"
description = "Import bank CSV transactions into FireflyIII with LLM-assisted categorization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "ollama>=0.2.1",
]

[project.scripts]
ffiii-importer = "ffiii_importer.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffiii_importer"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
